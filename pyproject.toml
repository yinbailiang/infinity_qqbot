[project]
name = "infinity-qqbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.4",
    "certifi>=2026.7.22",
    "infinity-bus[templates]>=4.1.0",
    "infinity-parse>=0.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（导入排序）
    "RUF", # ruff 专属规则（含 RUF022：`__all__` 排序）
]
ignore = [
    "RUF001", # 中文注释 / 文档中的全角标点误报
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["infinity_qqbot"]

[tool.ruff.lint.per-file-ignores]
# 聚合导出模块：通过 star import 重导出子模块符号
"src/infinity_qqbot/__init__.py" = ["F403", "F405"]
"src/infinity_qqbot/models/__init__.py" = ["F403", "F405"]
"src/infinity_qqbot/rpc/__init__.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "single"
