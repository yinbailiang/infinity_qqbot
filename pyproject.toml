[project]
name = "infinity-qqbot"
version = "0.1.0"
description = "基于 infinity_bus 事件总线的强类型 QQ 机器人引擎（aiohttp 网关 + 强类型 RPC）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "infinity_system: yin_bailiang" },
]
keywords = [
    "qqbot",
    "qq-bot",
    "event-bus",
    "asyncio",
    "websocket",
    "pydantic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.4",
    "certifi>=2026.7.22",
    "infinity-bus[templates]>=6.0.0",
    "infinity-parse>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "infinity-agent-kit>=1.0.0",
    "interrogate",
    "pre-commit",
    "pyright",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/yinbailiang/infinity_qqbot"
Repository = "https://github.com/yinbailiang/infinity_qqbot"
Issues = "https://github.com/yinbailiang/infinity_qqbot/issues"
Changelog = "https://github.com/yinbailiang/infinity_qqbot/releases"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort（导入排序）
    "RUF", # ruff 专属规则（含 RUF022：`__all__` 排序）
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "RUF001", # 中文注释 / 文档中的全角标点误报
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["infinity_qqbot"]

[tool.ruff.lint.per-file-ignores]
# 聚合导出模块：通过 star import 重导出子模块符号
"src/infinity_qqbot/__init__.py" = ["F403", "F405"]
"src/infinity_qqbot/models/__init__.py" = ["F403", "F405"]
"src/infinity_qqbot/rpc/__init__.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.interrogate]
fail-under = 90
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
exclude = ["tests", "tools"]

[tool.uv.build-backend]
module-root = "src"
module-name = "infinity_qqbot"

[tool.uv.workspace]
members = [
    "example/test",
]
